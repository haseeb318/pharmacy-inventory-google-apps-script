<!-- Dedicated Login & Sign Up Page View -->
<div id="login-page" class="login-page-wrapper">
  <div class="login-container">
    <!-- Branding Header -->
    <div class="login-brand">
      <div class="login-logo">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2v20M2 12h20" />
        </svg>
      </div>
      <h1 class="login-title">Pharmacy Management</h1>
      <p class="login-subtitle">
        Sign in to manage inventory, sales, and reports
      </p>
    </div>

    <!-- Auth Card -->
    <div class="login-card">
      <!-- Sign In Form -->
      <form id="main-login-form" class="login-form-content">
        <div
          id="main-login-error"
          class="login-alert alert-danger"
          style="display: none"
        ></div>

        <div class="login-field">
          <label for="main-login-email">Email Address</label>
          <div class="input-with-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            <input
              type="email"
              id="main-login-email"
              placeholder="user@pharmacy.com"
              required
              autocomplete="username"
            />
          </div>
        </div>

        <div class="login-field">
          <label for="main-login-password">Password</label>
          <div class="input-with-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input
              type="password"
              id="main-login-password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <button type="submit" class="login-submit-btn" id="login-submit-button" aria-busy="false">
          <span>Sign In to Dashboard</span>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>
    </div>

    <!-- Footer Note -->
    <div class="login-footer">
      <span>Pharmacy Management System &bull; Secure Authentication</span>
    </div>
  </div>
</div>
