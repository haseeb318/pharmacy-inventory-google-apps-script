<header class="topbar">
  <div class="topbar-left">
    <button
      id="sidebar-toggle"
      class="icon-button menu-toggle"
      type="button"
      data-action="toggle-sidebar"
      aria-label="Toggle sidebar navigation"
      aria-expanded="true"
      title="Toggle sidebar"
    >
      <!-- Standard accessible hamburger menu icon -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topbar-titles">
      <h1 id="page-title">Dashboard</h1>
      <p id="page-subtitle">Overview of inventory activity</p>
    </div>
  </div>

  <div class="topbar-right">
    <div class="global-search">
      <label class="sr-only" for="global-search-input"
        >Search current page</label
      >
      <input
        id="global-search-input"
        type="search"
        placeholder="Search current page"
      />
    </div>
    <div class="user-chip" id="user-chip">
      <span class="user-avatar" id="user-avatar-text" aria-hidden="true"
        >U</span
      >
      <span class="user-meta">
        <strong id="user-name">Loading...</strong>
        <small id="user-role">Loading</small>
      </span>
      <button
        id="logout-btn"
        class="button button-ghost button-small logout-button"
        type="button"
        title="Sign out of system"
      >
        Logout
      </button>
    </div>
  </div>
</header>
