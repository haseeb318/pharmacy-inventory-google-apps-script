<section
  class="page-section"
  data-page="sales"
  data-title="Sales"
  data-subtitle="Record customer sales and stock decreases"
>
  <div class="toolbar">
    <div class="toolbar-search">
      <label class="sr-only" for="sales-search">Search sales</label>
      <input
        id="sales-search"
        type="search"
        placeholder="Search sales"
        data-sales-search
      />
    </div>
    <button
      class="button button-primary"
      type="button"
      data-action="open-sale-modal"
    >
      New Sale
    </button>
  </div>

  <article class="card">
    <div class="card-header">
      <h2>Sales Entries</h2>
      <div class="card-meta">
        <span id="sales-count" class="status-pill">0 sales</span>
        <span id="sales-summary" class="muted-text">No sales yet</span>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Invoice</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total Amount</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="sales-table-body"></tbody>
      </table>
    </div>
    <div class="pagination" id="sales-pagination">
      <button
        class="button button-ghost button-small"
        type="button"
        data-sales-prev
      >
        Previous
      </button>
      <span id="sales-pagination-summary">Showing 0 sales</span>
      <button
        class="button button-ghost button-small"
        type="button"
        data-sales-next
      >
        Next
      </button>
    </div>
  </article>

  <!-- Sale Modal -->
  <div
    class="modal-backdrop"
    id="sale-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sale-modal-title"
    aria-hidden="true"
  >
    <section class="modal modal-wide">
      <div class="modal-header">
        <h2 id="sale-modal-title">New Sale</h2>
        <button
          class="icon-button"
          type="button"
          data-sale-modal-close
          aria-label="Close sale dialog"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="sale-form" class="form-grid">
        <input type="hidden" id="sale-id" name="id" />
        <input type="hidden" id="sale-invoice-number" name="invoiceNumber" />

        <!-- Line Items Table -->
        <div class="field-group field-full">
          <span class="field-label-text">Items Sold</span>
          <div id="sale-items-container">
            <!-- Dynamic rows inserted here by JavaScript -->
          </div>
          <button
            class="button button-ghost button-small"
            type="button"
            data-add-sale-item
            style="margin-top: 8px"
          >
            + Add Item
          </button>
        </div>

        <div class="field-group">
          <label for="sale-total-amount-display">Total Amount</label>
          <input
            id="sale-total-amount-display"
            type="text"
            readonly
            class="input-readonly"
            value="0.00"
          />
        </div>

        <div class="field-group">
          <label for="sale-customer-name-input">Customer Name</label>
          <input
            id="sale-customer-name-input"
            name="customerName"
            type="text"
            required
          />
        </div>

        <div class="field-group">
          <label for="sale-customer-phone-input">Customer Phone</label>
          <input
            id="sale-customer-phone-input"
            name="customerPhone"
            type="text"
          />
        </div>

        <div class="field-group">
          <label for="sale-date-input">Sale Date</label>
          <input id="sale-date-input" name="saleDate" type="date" required />
        </div>

        <div class="field-group">
          <label for="sale-payment-method-input">Payment Method</label>
          <select id="sale-payment-method-input" name="paymentMethod">
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
        </div>

        <div class="field-group">
          <label for="sale-status-input">Status</label>
          <select id="sale-status-input" name="status">
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

        <div class="field-group field-full">
          <label for="sale-notes-input">Notes</label>
          <textarea id="sale-notes-input" name="notes" rows="3"></textarea>
        </div>

        <p id="sale-form-error" class="form-error" role="alert"></p>
        <div class="modal-actions field-full">
          <button
            class="button button-ghost"
            type="button"
            data-sale-modal-close
          >
            Cancel
          </button>
          <button class="button button-primary" type="submit">Save Sale</button>
        </div>
      </form>
    </section>
  </div>

  <!-- Invoice Preview Modal -->
  <div
    class="modal-backdrop"
    id="sale-invoice-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sale-invoice-modal-title"
    aria-hidden="true"
  >
    <section class="modal modal-wide">
      <div class="modal-header">
        <h2 id="sale-invoice-modal-title">Invoice</h2>
        <button
          class="icon-button"
          type="button"
          data-sale-invoice-modal-close
          aria-label="Close invoice dialog"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" id="sale-invoice-content">
        <!-- Invoice HTML rendered here -->
      </div>
      <div class="modal-actions field-full" style="padding: 16px">
        <button
          class="button button-ghost"
          type="button"
          data-sale-invoice-modal-close
        >
          Close
        </button>
        <button
          class="button button-primary"
          type="button"
          data-print-invoice-btn
        >
          Print
        </button>
      </div>
    </section>
  </div>
</section>
