    <div
      id="loading-overlay"
      class="loading-overlay"
      aria-live="polite"
      aria-hidden="true"
    >
      <div class="spinner" aria-label="Loading"></div>
      <span>Loading</span>
    </div>

    <div
      id="toast-region"
      class="toast-region"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <div
      id="confirm-dialog"
      class="modal-backdrop"
      role="presentation"
      aria-hidden="true"
    >
      <section
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirm-title"
      >
        <div class="modal-header">
          <h2 id="confirm-title">Confirm action</h2>
          <button
            class="icon-button"
            type="button"
            data-confirm-cancel
            aria-label="Close dialog"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <p id="confirm-message" class="modal-copy">
          Are you sure you want to continue?
        </p>
        <div class="modal-actions">
          <button class="button button-ghost" type="button" data-confirm-cancel>
            Cancel
          </button>
          <button class="button button-danger" type="button" data-confirm-ok>
            Confirm
          </button>
        </div>
      </section>
    </div>

    <!-- Tom Select JS (MUST load before script include) -->
