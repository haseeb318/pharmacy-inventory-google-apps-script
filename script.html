    const formatters = {
      currency: new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "PKR",
        maximumFractionDigits: 2,
      }),
      number: new Intl.NumberFormat("en-US", {
        maximumFractionDigits: 2,
      }),
      date: new Intl.DateTimeFormat("en-US", {
        year: "numeric",
        month: "short",
        day: "2-digit",
      }),
      dateTime: new Intl.DateTimeFormat("en-US", {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }),
    };
    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function formatDateForInput_(dateVal) {
      if (!dateVal) return "";
      const s = String(dateVal).trim();
      if (!s) return "";

      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        return s;
      }

      const ymdMatch = s.match(/^(\d{4}-\d{2}-\d{2})/);
      if (ymdMatch) {
        return ymdMatch[1];
      }

      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      return "";
    }

    function init() {
      cachePages();
      bindEvents();
      hideAllViews();
      loadBootstrap();
    }

    function hideAllViews() {
      const page = document.querySelector("#login-page");
      const appShell = document.querySelector("#app");
      if (page) page.style.display = "none";
      if (appShell) appShell.style.display = "none";
    }

    function cachePages() {
      document.querySelectorAll(selectors.page).forEach((section) => {
        state.pages.set(section.dataset.page, {
          element: section,
          title: section.dataset.title || "Inventory",
          subtitle: section.dataset.subtitle || "",
        });
      });
    }

    function bindEvents() {
      window.addEventListener("hashchange", () => navigate(getInitialRoute()));

      document.querySelectorAll(selectors.menuLink).forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          navigate(link.dataset.route);
        });
      });

      document.querySelectorAll(selectors.routeButton).forEach((button) => {
        button.addEventListener("click", () =>
          navigate(button.dataset.routeButton),
        );
      });

      document
        .querySelector(selectors.sidebarToggle)
        .addEventListener("click", toggleSidebar);

      document.querySelector(selectors.globalSearch).addEventListener(
        "input",
        debounce((event) => {
          filterCurrentPage(event.target.value);
        }, 200),
      );

      document
        .querySelectorAll('[data-action="refresh-page"]')
        .forEach((button) => {
          button.addEventListener("click", () => {
            refreshCurrentPage();
          });
        });

      bindConfirmDialog();
      bindAuthEvents();
      bindUsersModule();
      bindItemsModule();
      bindPurchasesModule();
      bindSalesModule();
      bindReportsModule();
      bindInventoryModule();
      bindSettingsModule();
    }

    function getInitialRoute() {
      return (
        normalizeRoute(window.location.hash.replace("#", "")) || "dashboard"
      );
    }

    function normalizeRoute(route) {
      const value = String(route || "")
        .trim()
        .toLowerCase();
      return state.pages.has(value) ? value : "";
    }

    const ADMIN_ONLY_ROUTES = ["users", "items", "purchases", "settings"];
    const STAFF_REPORT_TYPES = ["sales", "purchases", "lowstock"];

    function getDefaultReportTypeForRole(role) {
      return "sales";
    }

    function isReportTypeAllowedForRole(reportType, role) {
      return STAFF_REPORT_TYPES.includes(reportType);
    }

    function navigate(route, options = {}) {
      let nextPage = normalizeRoute(route) || "dashboard";

      // Role permission navigation guard
      if (
        state.user &&
        state.user.role === "Staff" &&
        ADMIN_ONLY_ROUTES.includes(nextPage)
      ) {
        toast("Access Denied: Admin privileges required.", "warning");
        nextPage = "dashboard";
      }

      const pageConfig = state.pages.get(nextPage);

      state.pages.forEach((config, pageName) => {
        const isActive = pageName === nextPage;
        config.element.classList.toggle("active", isActive);
        config.element.setAttribute("aria-hidden", String(!isActive));
      });

      document.querySelectorAll(selectors.menuLink).forEach((link) => {
        const isActive = link.dataset.route === nextPage;
        link.classList.toggle("active", isActive);
        link.setAttribute("aria-current", isActive ? "page" : "false");
      });

      document.querySelector(selectors.pageTitle).textContent =
        pageConfig.title;
      document.querySelector(selectors.pageSubtitle).textContent =
        pageConfig.subtitle;
      document.querySelector(selectors.globalSearch).value = "";
      state.currentPage = nextPage;
      closeSidebar();

      if (window.location.hash !== `#${nextPage}`) {
        if (options.replace) {
          history.replaceState(null, "", `#${nextPage}`);
        } else {
          history.pushState(null, "", `#${nextPage}`);
        }
      }

      document.querySelector(selectors.pageRoot).focus({ preventScroll: true });

      if (nextPage === "dashboard") {
        loadDashboard();
      }

      if (nextPage === "users" && !state.users.loaded) {
        loadUsers();
      }

      if (nextPage === "items" && !state.items.loaded) {
        loadItems();
      }

      if (nextPage === "purchases" && !state.purchases.loaded) {
        loadPurchases();
      }

      if (nextPage === "sales" && !state.sales.loaded) {
        loadSales();
      }

      if (nextPage === "reports") {
        loadReports(state.reports.currentType);
      }

      if (nextPage === "settings" && !state.settings.loaded) {
        loadSettings();
      }
    }

    function filterCurrentPage(query) {
      const activePage = state.pages.get(state.currentPage).element;
      const normalizedQuery = query.trim().toLowerCase();
      const searchableRows = activePage.querySelectorAll("tbody tr");

      if (!searchableRows.length) {
        return;
      }

      searchableRows.forEach((row) => {
        const rowText = row.textContent.toLowerCase();
        row.hidden =
          Boolean(normalizedQuery) && !rowText.includes(normalizedQuery);
      });
    }

    function setUser(user) {
      state.user = user || null;
      if (!user) return;

      const userNameEl = document.querySelector("#user-name");
      const userRoleEl = document.querySelector("#user-role");
      const userAvatarEl = document.querySelector("#user-avatar-text");

      if (userNameEl)
        userNameEl.textContent = user.name || user.email || "User";
      if (userRoleEl) userRoleEl.textContent = user.role || "Staff";
      if (userAvatarEl) {
        const initial = (user.name || user.email || "U")
          .charAt(0)
          .toUpperCase();
        userAvatarEl.textContent = initial;
      }

      applyRolePermissions(user.role);
    }

    function applyRolePermissions(role) {
      const adminElements = document.querySelectorAll(
        '[data-admin-only="true"]',
      );
      adminElements.forEach((el) => {
        if (role === "Staff") {
          el.classList.add("admin-hidden");
        } else {
          el.classList.remove("admin-hidden");
        }
      });

      document.querySelectorAll("[data-report-type]").forEach((button) => {
        const allowed = isReportTypeAllowedForRole(
          button.dataset.reportType,
          role,
        );
        button.hidden = !allowed;
      });

      if (!isReportTypeAllowedForRole(state.reports.currentType, role)) {
        state.reports.currentType = getDefaultReportTypeForRole(role);
        state.reports.loaded = false;
      }
    }

    function showAuthOverlay() {
      const page = document.querySelector("#login-page");
      const appShell = document.querySelector("#app");
      if (page) page.style.display = "flex";
      if (appShell) appShell.style.display = "none";
    }

    function hideAuthOverlay() {
      const page = document.querySelector("#login-page");
      const appShell = document.querySelector("#app");
      if (page) page.style.display = "none";
      if (appShell) appShell.style.display = "flex";
    }

    function bindAuthEvents() {
      const loginForm = document.querySelector("#main-login-form");
      const loginError = document.querySelector("#main-login-error");
      const logoutBtn = document.querySelector("#logout-btn");

      if (loginForm) {
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          loginError.style.display = "none";
          const email = document
            .querySelector("#main-login-email")
            .value.trim();
          const password = document.querySelector("#main-login-password").value;

          showLoading(true);
          serverCall("loginUser", email, password)
            .then((res) => {
              if (res && res.success && res.data) {
                state.sessionToken = res.data.token;
                storeSessionToken(res.data.token);
                setUser(res.data.user);
                hideAuthOverlay();
                toast("Logged in successfully.", "success");
                refreshCurrentPage();
              } else {
                loginError.textContent =
                  (res && res.message) || "Login failed.";
                loginError.style.display = "block";
              }
            })
            .catch((err) => {
              loginError.textContent = err.message || "Invalid credentials.";
              loginError.style.display = "block";
            })
            .finally(() => showLoading(false));
        });
      }

      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          if (state.sessionToken) {
            serverCall("logoutUser", state.sessionToken).catch(() => {});
          }
          state.sessionToken = null;
          state.user = null;
          clearStoredSessionToken();
          showAuthOverlay();
          toast("Logged out.", "info");
        });
      }
    }

    function loadBootstrap() {
      showLoading(true);

      serverCall("getAppBootstrap", state.sessionToken)
        .then((response) => {
          const user = response && response.data ? response.data.user : null;
          if (user) {
            setUser(user);
          }

          if (state.sessionToken && user && user.isAuthenticated) {
            hideAuthOverlay();
            navigate(getInitialRoute(), { replace: true });
          } else {
            state.sessionToken = null;
            state.user = null;
            clearStoredSessionToken();
            showAuthOverlay();
          }

          toast("Application ready.", "success");
        })
        .catch((error) => {
          state.sessionToken = null;
          state.user = null;
          clearStoredSessionToken();
          showAuthOverlay();
          toast(
            error.message || "Unable to load application details.",
            "error",
          );
        })
        .finally(() => showLoading(false));
    }

    function refreshCurrentPage() {
      if (state.currentPage === "dashboard") {
        loadDashboard({ force: true });
        return;
      }

      if (state.currentPage === "users") {
        loadUsers({ force: true });
        return;
      }

      if (state.currentPage === "items") {
        loadItems({ force: true });
        return;
      }

      if (state.currentPage === "purchases") {
        loadPurchases({ force: true });
        return;
      }

      if (state.currentPage === "sales") {
        loadSales({ force: true });
        return;
      }

      if (state.currentPage === "reports") {
        loadReports(state.reports.currentType, { force: true });
        return;
      }

      if (state.currentPage === "settings") {
        loadSettings({ force: true });
        return;
      }

      toast("Current page refreshed.", "success");
    }

    function bindUsersModule() {
      const searchInput = document.querySelector(selectors.usersSearch);
      const roleFilter = document.querySelector(selectors.usersRoleFilter);
      const statusFilter = document.querySelector(selectors.usersStatusFilter);
      const userForm = document.querySelector(selectors.userForm);

      searchInput.addEventListener(
        "input",
        debounce((event) => {
          state.users.query = event.target.value.trim().toLowerCase();
          state.users.page = 1;
          renderUsers();
        }, 200),
      );

      roleFilter.addEventListener("change", (event) => {
        state.users.role = event.target.value;
        state.users.page = 1;
        renderUsers();
      });

      statusFilter.addEventListener("change", (event) => {
        state.users.status = event.target.value;
        state.users.page = 1;
        renderUsers();
      });

      document
        .querySelector('[data-action="open-user-modal"]')
        .addEventListener("click", () => {
          openUserModal();
        });

      document.querySelectorAll("[data-user-modal-close]").forEach((button) => {
        button.addEventListener("click", closeUserModal);
      });

      document
        .querySelector(selectors.usersPrev)
        .addEventListener("click", () => {
          state.users.page = Math.max(state.users.page - 1, 1);
          renderUsers();
        });

      document
        .querySelector(selectors.usersNext)
        .addEventListener("click", () => {
          const totalPages = getUsersTotalPages();
          state.users.page = Math.min(state.users.page + 1, totalPages);
          renderUsers();
        });

      document
        .querySelector(selectors.usersTableBody)
        .addEventListener("click", handleUsersTableClick);

      userForm.addEventListener("submit", handleUserFormSubmit);
    }

    function loadUsers(options = {}) {
      if (state.users.loaded && !options.force) {
        return;
      }

      showLoading(true);

      serverCall("getUsers", state.sessionToken)
        .then((response) => {
          applyUsersData(response.data);
          toast("Users loaded.", "success");
        })
        .catch((error) => {
          toast(error.message || "Unable to load users.", "error");
        })
        .finally(() => showLoading(false));
    }

    function applyUsersData(data) {
      const payload = data || {};
      state.users.records = payload.users || [];
      state.users.roles = payload.roles || ["Admin", "Staff"];
      state.users.statuses = payload.statuses || ["Active", "Inactive"];
      state.users.loaded = true;

      hydrateUsersSelects();
      renderUsers();
    }

    function hydrateUsersSelects() {
      fillSelect(
        document.querySelector(selectors.usersRoleFilter),
        state.users.roles,
        "All roles",
      );
      fillSelect(
        document.querySelector(selectors.usersStatusFilter),
        state.users.statuses,
        "All statuses",
      );
      fillSelect(
        document.querySelector(selectors.userRoleInput),
        state.users.roles,
      );
      fillSelect(
        document.querySelector(selectors.userStatusInput),
        state.users.statuses,
      );
    }

    function fillSelect(select, values, emptyLabel) {
      const currentValue = select.value;
      select.innerHTML = "";

      if (emptyLabel) {
        const emptyOption = document.createElement("option");
        emptyOption.value = "";
        emptyOption.textContent = emptyLabel;
        select.appendChild(emptyOption);
      }

      values.forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });

      if ([...select.options].some((option) => option.value === currentValue)) {
        select.value = currentValue;
      }
    }

    function renderUsers() {
      const filteredUsers = getFilteredUsers();
      const totalPages = getUsersTotalPages(filteredUsers);
      state.users.page = Math.min(Math.max(state.users.page, 1), totalPages);

      const start = (state.users.page - 1) * state.users.pageSize;
      const pageRows = filteredUsers.slice(start, start + state.users.pageSize);
      const tbody = document.querySelector(selectors.usersTableBody);

        selectors.usersSummary,

      const tr = document.createElement("tr");
      tr.dataset.userId = user.id;

      label,
      action,
      recordId,
      variant,

    ) {
      const button = document.createElement("button");
      button.className = `button ${variant} button-small`;

    function getFilteredUsers() {
      return state.users.records.filter((user) => {
        const text =
          `${user.id} ${user.name} ${user.email} ${user.role} ${user.status}`.toLowerCase();
        const matchesQuery =
          !state.users.query || text.includes(state.users.query);
        const matchesRole = !state.users.role || user.role === state.users.role;
        const matchesStatus =
          !state.users.status || user.status === state.users.status;
        return matchesQuery && matchesRole && matchesStatus;
      });

      return Math.max(

      if (!total) {

    function handleUserFormSubmit(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const userId = document.querySelector(selectors.userIdInput).value;
      const payload = {
        name: form.elements.name.value,
        email: form.elements.email.value,
        role: form.elements.role.value,
        status: form.elements.status.value,
        password: form.elements.password.value,
      };

      if (!validateUserForm(payload)) {
        return;
      }

      showLoading(true);
      serverCall(
        userId ? "updateUser" : "createUser",
        ...(userId
          ? [userId, payload, state.sessionToken]
          : [payload, state.sessionToken]),
      )
        .then((response) => {
          applyUsersData(response.data);
          closeUserModal();
          toast(userId ? "User updated." : "User created.", "success");
        })
        .catch((error) => {
          setText(
            selectors.userFormError,
            error.message || "Unable to save user.",
          );
        })
        .finally(() => showLoading(false));
    }

    function validateUserForm(payload) {
      const name = payload.name.trim();
      const email = payload.email.trim();
      const password = payload.password;
      const isNewUser = !document.querySelector(selectors.userIdInput).value;
      let message = "";

      if (name.length < 2) {
        message = "Name must be at least 2 characters.";
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        message = "Enter a valid email address.";
      } else if (isNewUser && (!password || password.length < 6)) {
        message = "Password must be at least 6 characters.";
      } else if (password && password.length > 0 && password.length < 6) {
        message = "Password must be at least 6 characters.";
      } else if (!payload.role) {
        message = "Select a role.";
      } else if (!payload.status) {
        message = "Select a status.";
      }

      setText(selectors.userFormError, message);
      return !message;
    }

      showLoading(true);

      serverCall("getDashboardOverview", state.sessionToken)

          state.dashboardLoaded = true;
          renderDashboard(state.dashboardData);
          toast("Dashboard updated.", "success");
        })
        .catch((error) => {
          // On error, render with empty data so the UI shows "No data" states
          // instead of being stuck with "Loading..." or stale data
          state.dashboardData = {};
          state.dashboardLoaded = true;
          renderDashboard(state.dashboardData);

            error && error.message

        tbody.appendChild(createEmptyRow(5, "No expiring batches found."));
        return;

      rows.forEach((row) => {

        const itemName = row.itemName || row.itemId || "Unknown";
        const batchNumber = row.batchNumber || "-";
        const remaining = row.remainingQuantity ?? row.remaining ?? 0;

    function parseDateSafe_(value) {
      if (!value) return null;
      if (value instanceof Date) return isNaN(value.getTime()) ? null : value;
      const str = String(value).trim();
      if (!str || str === "-" || str === "Not updated" || str === "No date") {
        return null;
      }

      // Handle YYYY-MM-DD format in local timezone to avoid UTC day shift
      const dateOnly = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (dateOnly) {
        return new Date(
          Number(dateOnly[1]),
          Number(dateOnly[2]) - 1,
          Number(dateOnly[3]),
        );
      }

      // Handle ISO strings or YYYY-MM-DD HH:mm:ss format
      const normalized = str.replace(" ", "T");
      const d = new Date(normalized);
      if (!isNaN(d.getTime())) return d;

      const fallback = new Date(str);
      return isNaN(fallback.getTime()) ? null : fallback;
    }

    function formatDate(value) {
      if (!value || value === "-" || value === "Not updated" || value === "No date") {
        return "-";
      }
      const date = parseDateSafe_(value);
      return !date ? "-" : formatters.date.format(date);
    }

    function serverCall(functionName, ...args) {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.script || !google.script.run) {
          resolve(getLocalPreviewResponse(functionName, ...args));
          return;
        }

        const runner = google.script.run
          .withSuccessHandler((response) => {
            if (response && response.success === false) {
              reject(new Error(response.message));
              return;
            }
            resolve(response);
          })
          .withFailureHandler((error) => reject(error));

        // GAS uses a Proxy object - typeof check fails on it.
        // Call the function directly; GAS will throw if it doesn't exist.
        try {
          if (args.length === 0) {
            runner[functionName]();
          } else if (args.length === 1) {
            runner[functionName](args[0]);
          } else if (args.length === 2) {
            runner[functionName](args[0], args[1]);
          } else if (args.length === 3) {
            runner[functionName](args[0], args[1], args[2]);
          } else {
            runner[functionName].apply(runner, args);
          }
        } catch (e) {
          reject(
            new Error(`Server function "${functionName}" is not available.`),
          );
        }
      });
    }

    function applyItemsData(data) {
      const payload = data || {};
      state.items.records = payload.items || [];
      state.items.categories = payload.categories || [];
      state.items.units = payload.units || [];
      state.items.loaded = true;

      state.dashboardLoaded = false;
      state.reports.loaded = false;
      state.inventory.loaded = false;

      hydrateItemsSelects();
      renderItems();

    function hydrateItemsSelects() {
      fillSelect(
        document.querySelector(selectors.itemsCategoryFilter),

    function renderItems() {
      const filteredItems = getFilteredItems();
      const totalPages = getItemsTotalPages(filteredItems);
      state.items.page = Math.min(Math.max(state.items.page, 1), totalPages);

      const start = (state.items.page - 1) * state.items.pageSize;
      const pageRows = filteredItems.slice(start, start + state.items.pageSize);
      const tbody = document.querySelector(selectors.itemsTableBody);
      tbody.innerHTML = "";

      if (!pageRows.length) {
        tbody.appendChild(createEmptyRow(9, "No items found."));
      } else {
        pageRows.forEach((item) => tbody.appendChild(createItemRow(item)));
      }

      setText(
        selectors.itemsCount,
        `${filteredItems.length} ${filteredItems.length === 1 ? "item" : "items"}`,
      );
      setText(
        selectors.itemsSummary,
        getItemsPaginationSummary(filteredItems.length, start, pageRows.length),
      );

      const paginationDiv = document.querySelector(selectors.itemsPagination);
      paginationDiv.style.display = totalPages > 1 ? "flex" : "none";

      document.querySelector(selectors.itemsPrev).disabled =
        state.items.page <= 1;
      document.querySelector(selectors.itemsNext).disabled =
        state.items.page >= totalPages;
    }

    function createItemRow(item) {
      const tr = document.createElement("tr");
      tr.dataset.itemId = item.id;

      // Match items.html columns:
      // Name | Category | Quantity | Manufacturer | Location | Status | Actions
      appendCell(tr, item.name);
      appendCell(tr, item.category);
      appendCell(tr, formatters.number.format(item.currentStock || 0));
      appendCell(tr, item.manufacturer || "-");
      appendCell(tr, item.shelfLocation || "-");

      const statusCell = document.createElement("td");
      const badge = document.createElement("span");
      const status = item.status || "Active";
      badge.className = `status-badge ${status === "Inactive" ? "status-inactive" : "status-active"}`;
      badge.textContent = status;
      statusCell.appendChild(badge);
      tr.appendChild(statusCell);

      const actionsCell = document.createElement("td");
      actionsCell.className = "actions-cell";
      actionsCell.appendChild(
        createActionButton(
          "Edit",
          "edit-item",
          item.id,
          "button-ghost",
          "itemId",
        ),
      );
      actionsCell.appendChild(
        createActionButton(
          "Delete",
          "delete-item",
          item.id,
          "button-danger",
          "itemId",
        ),
      );
      tr.appendChild(actionsCell);

      return tr;
    }

    function getFilteredItems() {
      return state.items.records.filter((item) => {
        const text = `${item.id} ${item.name} ${item.category}`.toLowerCase();
        const matchesQuery =
          !state.items.query || text.includes(state.items.query);
        const matchesCategory =
          !state.items.category || item.category === state.items.category;

        let matchesStockFilter = !state.items.stockFilter;
        if (state.items.stockFilter === "low") {
          matchesStockFilter = item.isLowStock;
        } else if (state.items.stockFilter === "ok") {
          matchesStockFilter = !item.isLowStock;
        }

        let matchesExpiryFilter = !state.items.expiryFilter;
        if (state.items.expiryFilter) {
          if (!item.expiryDate) {
            matchesExpiryFilter = false;
          } else {
            const daysToExpiry = Math.ceil(
              (new Date(item.expiryDate) - new Date()) / (1000 * 60 * 60 * 24),
            );
            if (state.items.expiryFilter === "expired") {
              matchesExpiryFilter = daysToExpiry < 0;
            } else if (state.items.expiryFilter === "expiring-soon") {
              matchesExpiryFilter = daysToExpiry >= 0 && daysToExpiry <= 30;
            }
          }
        }

        return (
          matchesQuery &&
          matchesCategory &&
          matchesStockFilter &&
          matchesExpiryFilter
        );
      });
    }

    function getItemsTotalPages(filteredItems = getFilteredItems()) {
      return Math.max(
        Math.ceil(filteredItems.length / state.items.pageSize),
        1,
      );
    }

    function getItemsPaginationSummary(total, start, count) {
      if (!total) {
        return "Showing 0 items";
      }

      return `Showing ${start + 1}-${start + count} of ${total} items`;
    }

    function updateItemMarginDisplay() {
      const costInput = document.querySelector(selectors.itemCostPriceInput);
      const sellInput = document.querySelector(selectors.itemSellingPriceInput);
      const costPrice = parseFloat(costInput ? costInput.value : "") || 0;
      const sellingPrice = parseFloat(sellInput ? sellInput.value : "") || 0;

      let margin = 0;
      if (costPrice > 0) {
        margin = (((sellingPrice - costPrice) / costPrice) * 100).toFixed(2);
      }

      const marginDisplay = document.getElementById("item-margin-display");
      if (marginDisplay) {
        marginDisplay.value = margin + "%";
      }
    }

      const modal = document.querySelector(selectors.itemModal);
      modal.classList.remove("active");

    function handleItemFormSubmit(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const itemId = document.querySelector(selectors.itemIdInput).value;
      // Some inputs may not exist in the current items.html template.
      const safe = (elName, fallback) => {
        try {
          return form.elements[elName] ? form.elements[elName].value : fallback;
        } catch (e) {
          return fallback;
        }
      };

      const payload = {
        name: safe("name", ""),
        description: safe("description", ""),
        category: safe("category", ""),
        unit: safe("unit", ""),
        imageUrl: safe("imageUrl", ""),
        // cost/selling/minStock are no longer present in the modal UI.
        // Keep defaults so backend doesn’t crash.
        costPrice: parseFloat(safe("costPrice", "0")) || 0,
        sellingPrice: parseFloat(safe("sellingPrice", "0")) || 0,
        status: safe("status", "Active"),
        minimumStock: parseInt(safe("minimumStock", "1"), 10) || 1,
        manufacturer: safe("manufacturer", ""),
        shelfLocation: safe("shelfLocation", ""),
      };

      // If fields are missing from the template, force validation to succeed.
      // This prevents modal-open flow from breaking due to mismatched UI template.
      if (!validateItemForm(payload)) {
        // When cost/selling/minStock inputs are absent, validateItemForm may reject.
        // In that case, relax by setting safe defaults.
        payload.costPrice = 0;
        payload.sellingPrice = 0;
        payload.minimumStock = payload.minimumStock ?? 1;
        if (!validateItemForm(payload)) {
          return;
        }
      }

      showLoading(true);
      serverCall(
        itemId ? "updateItem" : "createItem",
        ...(itemId
          ? [itemId, payload, state.sessionToken]
          : [payload, state.sessionToken]),
      )
        .then((response) => {
          applyItemsData(response.data);
          closeItemModal();
          toast(itemId ? "Item updated." : "Item created.", "success");
        })
        .catch((error) => {
          setText(
            selectors.itemFormError,
            error.message || "Unable to save item.",
          );
        })
        .finally(() => showLoading(false));
    }

    function validateItemForm(payload) {
      const name = payload.name.trim();
      let message = "";

      if (name.length < 2) {
        message = "Name must be at least 2 characters.";
      } else if (!payload.category) {
        message = "Select a category.";
      } else if (payload.costPrice < 0) {
        message = "Cost price cannot be negative.";
      } else if (payload.sellingPrice < 0) {
        message = "Selling price cannot be negative.";
      } else if (
        payload.costPrice > 0 &&
        payload.sellingPrice > 0 &&
        payload.costPrice > payload.sellingPrice
      ) {
        message = "Selling price must be greater than or equal to cost price.";
      } else if (payload.minimumStock < 0) {
        message = "Minimum stock cannot be negative.";
      }

      setText(selectors.itemFormError, message);
      return !message;
    }

    function deleteItemRecord(itemId) {
      confirm("Delete this item? This action cannot be undone.").then(
        (confirmed) => {
          if (!confirmed) {
            return;

          showLoading(true);
          serverCall("deleteItem", itemId, state.sessionToken)

            .catch((error) => {
              toast(error.message || "Unable to delete item.", "error");
            })
            .finally(() => showLoading(false));
        },
      );
    }

        .addEventListener("input", updatePurchaseTotals);

      document
        .querySelector(selectors.purchaseUnitPriceInput)
        .addEventListener("input", updatePurchaseTotals);
      document
        .querySelector(selectors.purchaseTotalCostInput)
        .addEventListener("input", updatePurchaseTotals);

      // Stop auto-filling cost price once user manually edits it
      const costPriceInputEl = document.getElementById(
        "purchase-cost-price-input",
      );
      if (costPriceInputEl) {
        costPriceInputEl.addEventListener("input", () => {
          delete costPriceInputEl.dataset.autoFilled;
        });
      }
    }

    function loadPurchases(options = {}) {
      if (state.purchases.loaded && !options.force) {
        return;
      }

      showLoading(true);

      serverCall("getPurchases", state.sessionToken)
        .then((response) => {
          applyPurchasesData(response.data);
          toast("Purchases loaded.", "success");
        })
        .catch((error) => {
          toast(error.message || "Unable to load purchases.", "error");
        })
        .finally(() => showLoading(false));
    }

    function applyPurchasesData(data) {
      const payload = data || {};
      // Sort newest-first by purchaseDate then by id (fallback)
      const sorted = (payload.purchases || []).slice().sort((a, b) => {
        const dateA = a.purchaseDate ? new Date(a.purchaseDate).getTime() : 0;
        const dateB = b.purchaseDate ? new Date(b.purchaseDate).getTime() : 0;
        if (dateB !== dateA) return dateB - dateA;
        return String(b.id || "").localeCompare(String(a.id || ""));
      });
      state.purchases.records = sorted;
      state.purchases.items = payload.items || [];
      state.purchases.suppliers = payload.suppliers || [];
      state.purchases.loaded = true;

      state.items.loaded = false;
      state.dashboardLoaded = false;
      state.reports.loaded = false;
      state.inventory.loaded = false;

      hydratePurchaseSelects();
      renderPurchases();
    }

    function hydratePurchaseSelects() {
      const itemSelect = document.querySelector(selectors.purchaseItemInput);
      const supplierInput = document.querySelector(
        selectors.purchaseSupplierInput,
      );
      const currentItem = itemSelect.value;
      itemSelect.innerHTML = "";

      state.purchases.items.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = `${item.name} (${item.id})`;
        itemSelect.appendChild(option);
      });

      if (
        [...itemSelect.options].some((option) => option.value === currentItem)
      ) {
        itemSelect.value = currentItem;
      }

      if (state.purchases.suppliers.length) {
        supplierInput.setAttribute("list", "purchase-suppliers-list");
      }

      const existingList = document.getElementById("purchase-suppliers-list");
      if (existingList) {
        existingList.remove();
      }

      if (state.purchases.suppliers.length) {
        const datalist = document.createElement("datalist");
        datalist.id = "purchase-suppliers-list";
        state.purchases.suppliers.forEach((supplier) => {
          const option = document.createElement("option");
          option.value = supplier;
          datalist.appendChild(option);
        });
        document.body.appendChild(datalist);
      }
    }

    function renderPurchases() {
      const filteredPurchases = getFilteredPurchases();
      const totalPages = getPurchasesTotalPages(filteredPurchases);
      state.purchases.page = Math.min(
        Math.max(state.purchases.page, 1),
        totalPages,
      );

      const start = (state.purchases.page - 1) * state.purchases.pageSize;
      const pageRows = filteredPurchases.slice(
        start,
        start + state.purchases.pageSize,
      );
      const tbody = document.querySelector(selectors.purchasesTableBody);
      tbody.innerHTML = "";

      if (!pageRows.length) {
        tbody.appendChild(createEmptyRow(8, "No purchases found."));
      } else {
        pageRows.forEach((purchase) =>
          tbody.appendChild(createPurchaseRow(purchase)),
        );
      }

      setText(
        selectors.purchasesCount,
        `${filteredPurchases.length} ${filteredPurchases.length === 1 ? "purchase" : "purchases"}`,
      );
      setText(
        selectors.purchasesSummary,
        getPurchasesPaginationSummary(
          filteredPurchases.length,
          start,
          pageRows.length,
        ),
      );

      const paginationDiv = document.querySelector(
        selectors.purchasesPagination,
      );
      paginationDiv.style.display = totalPages > 1 ? "flex" : "none";

      document.querySelector(selectors.purchasesPrev).disabled =
        state.purchases.page <= 1;
      document.querySelector(selectors.purchasesNext).disabled =
        state.purchases.page >= totalPages;
    }

    function createPurchaseRow(purchase) {
      const tr = document.createElement("tr");
      tr.dataset.purchaseId = purchase.id;

      const item =
        state.purchases.items.find((record) => record.id === purchase.itemId) ||
        {};
      // Item (without id)
      appendCell(tr, item.name || purchase.itemId);

      appendCell(tr, purchase.quantity);
      appendCell(tr, formatters.currency.format(purchase.unitPrice));
      appendCell(tr, formatters.currency.format(purchase.costPrice));
      appendCell(tr, formatters.currency.format(purchase.sellingPrice));
      appendCell(tr, formatters.currency.format(purchase.totalCost));
      appendCell(tr, purchase.supplier || "-");
      appendCell(
        tr,
        purchase.purchaseDate ? formatDate(purchase.purchaseDate) : "-",
      );
      appendCell(tr, purchase.batchNumber || "-");

      const expiryCell = document.createElement("td");
      if (purchase.expiryDate) {
        const expiryDate = new Date(purchase.expiryDate);
        const daysToExpiry = Math.ceil(
          (expiryDate - new Date()) / (1000 * 60 * 60 * 24),
        );
        const badge = document.createElement("span");
        if (daysToExpiry < 0) {
          badge.className = "status-badge status-danger";
          badge.textContent = `Expired (${formatters.date.format(expiryDate)})`;
        } else if (daysToExpiry <= 30) {
          badge.className = "status-badge status-warning";
          badge.textContent = `Expiring (${formatters.date.format(expiryDate)})`;
        } else {
          badge.className = "status-badge status-active";
          badge.textContent = formatters.date.format(expiryDate);
        }
        expiryCell.appendChild(badge);
      } else {
        expiryCell.textContent = "-";
      }
      tr.appendChild(expiryCell);

      const remainingCell = document.createElement("td");
      remainingCell.className = "numeric-cell";
      if (purchase.remainingQuantity === 0) {
        remainingCell.innerHTML = `<span class="status-badge status-danger">0</span>`;
      } else {
        remainingCell.textContent = purchase.remainingQuantity;
      }
      tr.appendChild(remainingCell);

      const actionsCell = document.createElement("td");
      actionsCell.className = "actions-cell";
      actionsCell.appendChild(
        createActionButton(
          "Edit",
          "edit-purchase",
          purchase.id,
          "button-ghost",
          "purchaseId",
        ),
      );
      actionsCell.appendChild(
        createActionButton(
          "Delete",
          "delete-purchase",
          purchase.id,
          "button-danger",
          "purchaseId",
        ),
      );
      tr.appendChild(actionsCell);

      return tr;
    }

    function getFilteredPurchases() {
      return state.purchases.records.filter((purchase) => {
        const item =
          state.purchases.items.find(
            (record) => record.id === purchase.itemId,
          ) || {};
        const text =
          `${purchase.id} ${purchase.supplier} ${purchase.itemId} ${item.name || ""}`.toLowerCase();
        const matchesQuery =
          !state.purchases.query || text.includes(state.purchases.query);
        return matchesQuery;
      });
    }

    function getPurchasesTotalPages(
      filteredPurchases = getFilteredPurchases(),
    ) {
      return Math.max(
        Math.ceil(filteredPurchases.length / state.purchases.pageSize),
        1,
      );
    }

    function getPurchasesPaginationSummary(total, start, count) {
      if (!total) {
        return "Showing 0 purchases";
      }

      return `Showing ${start + 1}-${start + count} of ${total} purchases`;
    }

    function handlePurchasesTableClick(event) {
      const button = event.target.closest("button[data-action]");

      if (!button) {
        return;
      }

      const purchaseId = button.dataset.purchaseId;

      if (button.dataset.action === "edit-purchase") {
        const purchase = state.purchases.records.find(
          (record) => record.id === purchaseId,
        );
        openPurchaseModal(purchase);
      }

      if (button.dataset.action === "delete-purchase") {
        deletePurchaseRecord(purchaseId);
      }
    }

    function openPurchaseModal(purchase = null) {
      const modal = document.querySelector(selectors.purchaseModal);
      const form = document.querySelector(selectors.purchaseForm);

      if (!modal || !form) return;

      form.reset();
      setText(selectors.purchaseFormError, "");

      document.querySelector(selectors.purchaseModalTitle).textContent =
        purchase ? "Edit Purchase" : "New Purchase";

      const setVal = (selector, value) => {
        const el = document.querySelector(selector);
        if (el) el.value = value != null ? value : "";
      };

      setVal(selectors.purchaseIdInput, purchase ? purchase.id : "");
      setVal(selectors.purchaseItemInput, purchase ? purchase.itemId : "");
      setVal(
        selectors.purchaseQuantityInput,
        purchase ? purchase.quantity : "",
      );
      setVal(
        selectors.purchaseUnitPriceInput,
        purchase ? purchase.unitPrice : "",
      );
      setVal(
        selectors.purchaseTotalCostInput,
        purchase ? purchase.totalCost : "",
      );
      setVal(
        selectors.purchaseSupplierInput,
        purchase ? purchase.supplier : "",
      );
      setVal(
        selectors.purchaseBatchInput,
        purchase ? purchase.batchNumber : "",
      );

      setVal(
        selectors.purchaseExpiryInput,
        purchase ? formatDateForInput_(purchase.expiryDate) : "",
      );

      setVal(
        selectors.purchaseDateInput,
        purchase ? formatDateForInput_(purchase.purchaseDate) : "",
      );
      setVal(selectors.purchaseNotesInput, purchase ? purchase.notes : "");

      // Handle cost price field: for existing purchase use its value,
      // for new purchase mark it ready for auto-fill from unit price
      const costPriceInput = document.getElementById(
        "purchase-cost-price-input",
      );
      if (costPriceInput) {
        if (purchase) {
          costPriceInput.value =
            purchase.costPrice != null ? purchase.costPrice : "";
          delete costPriceInput.dataset.autoFilled;
        } else {
          costPriceInput.value = "";
          costPriceInput.dataset.autoFilled = "true";
        }
      }

      const sellPriceInput = document.getElementById(
        "purchase-selling-price-input",
      );
      if (sellPriceInput) {
        sellPriceInput.value =
          purchase && purchase.sellingPrice != null
            ? purchase.sellingPrice
            : "";
      }

      // Initialize TomSelect for searchable item dropdown after values are set
      initPurchaseItemTomSelect_();

      modal.classList.add("active");
      modal.setAttribute("aria-hidden", "false");
    }

    function closePurchaseModal() {
      const modal = document.querySelector(selectors.purchaseModal);
      modal.classList.remove("active");
      modal.setAttribute("aria-hidden", "true");

      // Destroy TomSelect to clean up DOM mutations
      const itemSelect = document.querySelector(selectors.purchaseItemInput);
      destroyTomSelectIfExists_(itemSelect);
    }

    function updatePurchaseTotals() {
      const quantity =
        parseFloat(
          document.querySelector(selectors.purchaseQuantityInput).value,
        ) || 0;
      const unitPrice =
        parseFloat(
          document.querySelector(selectors.purchaseUnitPriceInput).value,
        ) || 0;
      const totalCostInput = document.querySelector(
        selectors.purchaseTotalCostInput,
      );
      const costPriceInput = document.getElementById(
        "purchase-cost-price-input",
      );

      if (document.activeElement === totalCostInput) {
        return;
      }

      totalCostInput.value = (quantity * unitPrice).toFixed(2);

      // Auto-fill cost price from unit price if cost price is empty or user hasn't manually changed it
      if (
        costPriceInput &&
        (!costPriceInput.value || costPriceInput.dataset.autoFilled === "true")
      ) {
        costPriceInput.value = unitPrice > 0 ? unitPrice.toFixed(2) : "";
        costPriceInput.dataset.autoFilled = "true";
      }
    }

    function handlePurchaseFormSubmit(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const purchaseId = document.querySelector(
        selectors.purchaseIdInput,
      ).value;
      const payload = {
        itemId: form.elements.itemId.value,
        quantity: parseFloat(form.elements.quantity.value) || 0,
        unitPrice: parseFloat(form.elements.unitPrice.value) || 0,
        // Cost/Selling snapshots per batch are stored. For now we read them from the current item.
        costPrice: (() => {
          const v = parseFloat(form.elements.costPrice.value);
          if (!Number.isFinite(v)) {
            return (
              state.purchases.items.find(
                (i) => i.id === form.elements.itemId.value,
              )?.costPrice ?? 0
            );
          }
          return v;
        })(),
        sellingPrice: (() => {
          const v = parseFloat(form.elements.sellingPrice.value);
          if (!Number.isFinite(v)) {
            return (
              state.purchases.items.find(
                (i) => i.id === form.elements.itemId.value,
              )?.sellingPrice ?? 0
            );
          }
          return v;
        })(),
        totalCost: (() => {
          const v = parseFloat(form.elements.totalCost.value);
          return Number.isFinite(v) ? v : 0;
        })(),
        supplier: form.elements.supplier.value,
        batchNumber: form.elements.batchNumber.value,
        expiryDate: form.elements.expiryDate.value,
        purchaseDate: form.elements.purchaseDate.value,
        notes: form.elements.notes.value,
        createdBy: "System",
      };

      if (!validatePurchaseForm(payload)) {
        return;
      }

      showLoading(true);
      serverCall(
        purchaseId ? "updatePurchase" : "createPurchase",
        ...(purchaseId
          ? [purchaseId, payload, state.sessionToken]
          : [payload, state.sessionToken]),
      )
        .then((response) => {
          applyPurchasesData(response.data);
          closePurchaseModal();
          toast(
            purchaseId ? "Purchase updated." : "Purchase created.",
            "success",
          );
        })
        .catch((error) => {
          setText(
            selectors.purchaseFormError,
            error.message || "Unable to save purchase.",
          );
        })
        .finally(() => showLoading(false));
    }

    function validatePurchaseForm(payload) {
      let message = "";

      if (!payload.itemId) {
        message = "Select an item.";
      } else if (payload.quantity <= 0) {
        message = "Quantity must be greater than zero.";
      } else if (payload.unitPrice < 0) {
        message = "Unit price cannot be negative.";
      } else if (payload.totalCost < 0) {
        message = "Total cost cannot be negative.";
      } else if (!payload.supplier.trim()) {
        message = "Supplier is required.";
      } else if (!payload.purchaseDate) {
        message = "Purchase date is required.";
      }

      setText(selectors.purchaseFormError, message);
      return !message;
    }

    function deletePurchaseRecord(purchaseId) {
      confirm(
        "Delete this purchase? This will reduce stock by the recorded quantity.",
      ).then((confirmed) => {
        if (!confirmed) {
          return;
        }

        showLoading(true);
        serverCall("deletePurchase", purchaseId, state.sessionToken)
          .then((response) => {
            applyPurchasesData(response.data);
            toast("Purchase deleted.", "success");
          })
          .catch((error) => {
            toast(error.message || "Unable to delete purchase.", "error");
          })
          .finally(() => showLoading(false));
      });
    }

    function bindSalesModule() {
      const searchInput = document.querySelector(selectors.salesSearch);
      const saleForm = document.querySelector(selectors.saleForm);

      searchInput.addEventListener(
        "input",
        debounce((event) => {
          state.sales.query = event.target.value.trim().toLowerCase();
          state.sales.page = 1;
          renderSales();
        }, 200),
      );

      document
        .querySelector('[data-action="open-sale-modal"]')
        .addEventListener("click", () => {
          openSaleModal();
        });

      document.querySelectorAll("[data-sale-modal-close]").forEach((button) => {
        button.addEventListener("click", closeSaleModal);
      });

      document
        .querySelector(selectors.salesPrev)
        .addEventListener("click", () => {
          state.sales.page = Math.max(state.sales.page - 1, 1);
          renderSales();
        });

      document
        .querySelector(selectors.salesNext)
        .addEventListener("click", () => {
          const totalPages = getSalesTotalPages();
          state.sales.page = Math.min(state.sales.page + 1, totalPages);
          renderSales();
        });

      document
        .querySelector(selectors.salesTableBody)
        .addEventListener("click", handleSalesTableClick);

      saleForm.addEventListener("submit", handleSaleFormSubmit);

      // Add item button
      document
        .querySelector("[data-add-sale-item]")
        .addEventListener("click", () => {
          addSaleItemRow("", 1, 0);
        });

      // Invoice modal close
      document
        .querySelectorAll("[data-sale-invoice-modal-close]")
        .forEach((button) => {
          button.addEventListener("click", closeSaleInvoiceModal);
        });

      // Print invoice button
      document
        .querySelector("[data-print-invoice-btn]")
        .addEventListener("click", () => {
          const invoiceContent = document.querySelector(
            "#sale-invoice-content",
          );
          if (invoiceContent && invoiceContent.dataset.saleId) {
            printInvoice(invoiceContent.dataset.saleId);
          }
        });
    }

    function loadSales(options = {}) {
      if (state.sales.loaded && !options.force) {
        return;
      }

      showLoading(true);

      serverCall("getSales", state.sessionToken)
        .then((response) => {
          applySalesData(response.data);
          toast("Sales loaded.", "success");
        })
        .catch((error) => {
          toast(error.message || "Unable to load sales.", "error");
        })
        .finally(() => showLoading(false));
    }

    function applySalesData(data) {
      const payload = data || {};
      // Sort newest-first by saleDate then id
      const sorted = (payload.sales || []).slice().sort((a, b) => {
        const dateA = a.saleDate ? new Date(a.saleDate).getTime() : 0;
        const dateB = b.saleDate ? new Date(b.saleDate).getTime() : 0;
        if (dateB !== dateA) return dateB - dateA;
        return String(b.id || "").localeCompare(String(a.id || ""));
      });
      state.sales.records = sorted;
      state.sales.items = payload.items || [];
      state.sales.customers = payload.customers || [];
      state.sales.itemSellingPrices = payload.itemSellingPrices || {};
      state.sales.loaded = true;

      // Auto-refresh: invalidate dependent pages so they fetch fresh data next navigation
      state.items.loaded = false;
      state.dashboardLoaded = false;
      state.reports.loaded = false;
      state.inventory.loaded = false;

      hydrateSaleSelects();
      renderSales();
    }

    function hydrateSaleSelects() {
      // Sale items are managed via dynamic line-item rows, not a single select.
      // Only populate the customer datalist.
      const customerInput = document.querySelector(
        selectors.saleCustomerNameInput,
      );

      const existingList = document.getElementById("sale-customers-list");
      if (existingList) {
        existingList.remove();
      }

      if (state.sales.customers.length) {
        const datalist = document.createElement("datalist");
        datalist.id = "sale-customers-list";
        state.sales.customers.forEach((customer) => {
          const option = document.createElement("option");
          option.value = customer;
          datalist.appendChild(option);
        });
        customerInput.setAttribute("list", datalist.id);
        document.body.appendChild(datalist);
      } else {
        customerInput.removeAttribute("list");
      }
    }

    function renderSales() {
      const filteredSales = getFilteredSales();
      const totalPages = getSalesTotalPages(filteredSales);
      state.sales.page = Math.min(Math.max(state.sales.page, 1), totalPages);

      const start = (state.sales.page - 1) * state.sales.pageSize;
      const pageRows = filteredSales.slice(start, start + state.sales.pageSize);
      const tbody = document.querySelector(selectors.salesTableBody);
      tbody.innerHTML = "";

      if (!pageRows.length) {
        tbody.appendChild(createEmptyRow(8, "No sales found."));
      } else {
        pageRows.forEach((sale) => tbody.appendChild(createSaleRow(sale)));
      }

      setText(
        selectors.salesCount,
        `${filteredSales.length} ${filteredSales.length === 1 ? "sale" : "sales"}`,
      );
      setText(
        selectors.salesSummary,
        getSalesPaginationSummary(filteredSales.length, start, pageRows.length),
      );

      const paginationDiv = document.querySelector(selectors.salesPagination);
      paginationDiv.style.display = totalPages > 1 ? "flex" : "none";

      document.querySelector(selectors.salesPrev).disabled =
        state.sales.page <= 1;
      document.querySelector(selectors.salesNext).disabled =
        state.sales.page >= totalPages;
    }

    function createSaleRow(sale) {
      const tr = document.createElement("tr");
      tr.dataset.saleId = sale.id;

      appendCell(tr, sale.invoiceNumber || "-");
      appendCell(tr, sale.customerName || "-");
      appendCell(tr, `${sale.itemCount || 0} item(s)`);
      appendCell(
        tr,
        formatters.currency.format(sale.totalAmount || 0),
        "numeric-cell",
      );
      appendCell(tr, sale.saleDate ? formatDate(sale.saleDate) : "-");

      const statusCell = document.createElement("td");
      const badge = document.createElement("span");
      const status = sale.status || "Completed";
      badge.className = `status-badge ${status === "Cancelled" ? "status-inactive" : status === "Pending" ? "status-warning" : "status-active"}`;
      badge.textContent = status;
      statusCell.appendChild(badge);
      tr.appendChild(statusCell);

      const actionsCell = document.createElement("td");
      actionsCell.className = "actions-cell";
      actionsCell.appendChild(
        createActionButton(
          "Edit",
          "edit-sale",
          sale.id,
          "button-ghost",
          "saleId",
        ),
      );
      actionsCell.appendChild(
        createActionButton(
          "Print",
          "print-sale",
          sale.id,
          "button-ghost",
          "saleId",
        ),
      );
      actionsCell.appendChild(
        createActionButton(
          "Delete",
          "delete-sale",
          sale.id,
          "button-danger",
          "saleId",
        ),
      );
      tr.appendChild(actionsCell);

      return tr;
    }

    function getFilteredSales() {
      return state.sales.records.filter((sale) => {
        const text =
          `${sale.id} ${sale.invoiceNumber} ${sale.customerName} ${sale.customerPhone}`.toLowerCase();
        const matchesQuery =
          !state.sales.query || text.includes(state.sales.query);
        return matchesQuery;
      });
    }

    function getSalesTotalPages(filteredSales = getFilteredSales()) {
      return Math.max(
        Math.ceil(filteredSales.length / state.sales.pageSize),
        1,
      );
    }

    function getSalesPaginationSummary(total, start, count) {
      if (!total) {
        return "Showing 0 sales";
      }

      return `Showing ${start + 1}-${start + count} of ${total} sales`;
    }

    function handleSalesTableClick(event) {
      const button = event.target.closest("button[data-action]");

      if (!button) {
        return;
      }

      const saleId = button.dataset.saleId;

      if (button.dataset.action === "edit-sale") {
        const sale = state.sales.records.find((record) => record.id === saleId);
        openSaleModal(sale);
      }

      if (button.dataset.action === "print-sale") {
        printInvoice(saleId);
      }

      if (button.dataset.action === "delete-sale") {
        deleteSaleRecord(saleId);
      }
    }

    function openSaleModal(sale = null) {
      const modal = document.querySelector(selectors.saleModal);
      const form = document.querySelector(selectors.saleForm);
      form.reset();
      setText(selectors.saleFormError, "");

      document.querySelector(selectors.saleModalTitle).textContent = sale
        ? "Edit Sale"
        : "New Sale";
      document.querySelector(selectors.saleIdInput).value = sale ? sale.id : "";
      document.querySelector(selectors.saleInvoiceNumber).value = sale
        ? sale.invoiceNumber || ""
        : "";
      document.querySelector(selectors.saleCustomerNameInput).value = sale
        ? sale.customerName
        : "";
      document.querySelector(selectors.saleCustomerPhoneInput).value = sale
        ? sale.customerPhone
        : "";
      document.querySelector(selectors.saleDateInput).value = sale
        ? formatDateForInput_(sale.saleDate)
        : "";
      document.querySelector(selectors.salePaymentMethodInput).value = sale
        ? sale.paymentMethod
        : "Cash";
      document.querySelector(selectors.saleStatusInput).value = sale
        ? sale.status
        : "Completed";
      document.querySelector(selectors.saleNotesInput).value = sale
        ? sale.notes
        : "";

      // Build line items
      const container = document.querySelector("#sale-items-container");
      container.innerHTML = "";

      if (sale && sale.items && sale.items.length) {
        sale.items.forEach((item) => {
          addSaleItemRow(item.itemId, item.quantity, item.unitPrice);
        });
      } else {
        // Start with one empty row
        addSaleItemRow("", 1, 0);
      }

      updateSaleTotal();

      modal.classList.add("active");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeSaleModal() {
      const modal = document.querySelector(selectors.saleModal);
      modal.classList.remove("active");
      modal.setAttribute("aria-hidden", "true");

      // Destroy all TomSelect instances in the sale items container
      const container = document.querySelector("#sale-items-container");
      if (container) {
        container.querySelectorAll(".sale-item-select").forEach((select) => {
          destroyTomSelectIfExists_(select);
        });
      }
    }

    function initSaleItemTomSelect_(selectEl) {
      if (!selectEl) return;

      // If TomSelect already exists on this element, skip
      if (selectEl.tomselect) {
        return;
      }

      // If TomSelect library is not loaded, fall back to native select
      if (typeof TomSelect === "undefined") {
        console.warn(
          "TomSelect library is not loaded. Searchable dropdown will not work for sale items.",
        );
        return;
      }

      // Collect current options from the select element
      const options = [];
      // TomSelect requires a non-empty options array for proper initialization
      for (let i = 0; i < selectEl.options.length; i++) {
        const opt = selectEl.options[i];
        if (opt.value) {
          options.push({
            value: opt.value,
            text: opt.textContent,
          });
        }
      }

      // Store the currently selected value before TomSelect replaces the DOM
      const currentValue = selectEl.value;

      // Create TomSelect instance with search capability
      const ts = new TomSelect(selectEl, {
        options: options,
        create: false,
        maxItems: 1,
        placeholder: "Search for an item...",
        sortField: {
          field: "text",
          direction: "asc",
        },
        searchField: ["text"],
        render: {
          option: function (data, escape) {
            return (
              '<div class="ts-option-sale">' + escape(data.text) + "</div>"
            );
          },
          item: function (data, escape) {
            return '<div class="ts-item-sale">' + escape(data.text) + "</div>";
          },
        },
        onChange: function (value) {
          // Auto-populate unit price when an item is selected
          if (value) {
            const price = getItemSellingPrice_(value);
            const row = selectEl.closest(".sale-item-row");
            if (row) {
              const priceInput = row.querySelector(".sale-price-input");
              if (priceInput && !priceInput.dataset.userModified) {
                priceInput.value = price;
                updateSaleTotal();
              }
            }
          }
        },
      });

      // Restore the selected value
      if (currentValue) {
        ts.setValue(currentValue, true);
      }

      // Store reference on the element for cleanup
      selectEl.tomselect = ts;
    }

    function markPriceUserModified(event) {
      const input = event.currentTarget;
      input.dataset.userModified = "true";
    }

    function getItemSellingPrice_(itemId) {
      if (!itemId) return 0;
      if (
        state.sales.itemSellingPrices &&
        state.sales.itemSellingPrices[itemId] !== undefined
      ) {
        return state.sales.itemSellingPrices[itemId];
      }
      const itemsData = state.sales.items.length
        ? state.sales.items
        : state.items.records;
      const item = itemsData.find((i) => i.id === itemId);
      return item && item.sellingPrice != null ? item.sellingPrice : 0;
    }

    function addSaleItemRow(itemId = "", quantity = 1, unitPrice = 0) {
      const container = document.querySelector("#sale-items-container");
      const rowIndex = container.children.length + 1;

      const row = document.createElement("div");
      row.className = "sale-item-row";
      row.style.cssText =
        "display:flex;gap:8px;align-items:center;margin-bottom:8px;";

      // Item select
      const select = document.createElement("select");
      select.name = `sale-item-${rowIndex}`;
      select.className = "sale-item-select";
      select.style.cssText = "flex:2;min-width:150px;";
      select.required = true;

      // Populate with items
      const items = state.sales.items.length
        ? state.sales.items
        : state.items.records;
      items.forEach((item) => {
        const price = getItemSellingPrice_(item.id);
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = `${item.name} — PKR ${price}`;
        if (item.id === itemId) opt.selected = true;
        select.appendChild(opt);
      });

      // Quantity input
      const qtyInput = document.createElement("input");
      qtyInput.type = "number";
      qtyInput.name = `sale-qty-${rowIndex}`;
      qtyInput.className = "sale-qty-input";
      qtyInput.style.cssText = "flex:1;min-width:60px;";
      qtyInput.min = "1";
      qtyInput.step = "1";
      qtyInput.value = quantity;
      qtyInput.required = true;

      // Unit price input
      const priceInput = document.createElement("input");
      priceInput.type = "number";
      priceInput.name = `sale-price-${rowIndex}`;
      priceInput.className = "sale-price-input";
      priceInput.style.cssText = "flex:1;min-width:80px;";
      priceInput.min = "0";
      priceInput.step = "0.01";
      const initialPrice =
        unitPrice ||
        (itemId
          ? getItemSellingPrice_(itemId)
          : select.value
            ? getItemSellingPrice_(select.value)
            : 0);
      priceInput.value = initialPrice;
      priceInput.required = true;

      // Track user modifications to auto-populated price
      priceInput.addEventListener("input", markPriceUserModified);
      priceInput.addEventListener("change", markPriceUserModified);

      // Remove button
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "button button-danger button-small";
      removeBtn.textContent = "×";
      removeBtn.style.cssText = "flex:0 0 32px;";
      removeBtn.addEventListener("click", () => removeSaleItemRow(row));

      row.appendChild(select);
      row.appendChild(qtyInput);
      row.appendChild(priceInput);
      row.appendChild(removeBtn);

      // Update total on input change
      qtyInput.addEventListener("input", updateSaleTotal);
      priceInput.addEventListener("input", updateSaleTotal);

      container.appendChild(row);

      // Initialize TomSelect on the select element for searchable dropdown
      initSaleItemTomSelect_(select);
    }

    function removeSaleItemRow(row) {
      const container = document.querySelector("#sale-items-container");
      if (container.children.length <= 1) {
        toast("At least one item is required.", "warning");
        return;
      }
      row.remove();
      updateSaleTotal();
    }

    function updateSaleTotal() {
      const container = document.querySelector("#sale-items-container");
      const rows = container.querySelectorAll(".sale-item-row");
      let total = 0;

      rows.forEach((row) => {
        const qtyInput = row.querySelector(".sale-qty-input");
        const priceInput = row.querySelector(".sale-price-input");
        const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;
        const price = parseFloat(priceInput ? priceInput.value : 0) || 0;
        total += qty * price;
      });

      const totalDisplay = document.querySelector("#sale-total-amount-display");
      if (totalDisplay) {
        totalDisplay.value = formatters.currency.format(total);
      }
    }

    function handleSaleFormSubmit(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const saleId = document.querySelector(selectors.saleIdInput).value;

      // Collect items from DOM rows
      const container = document.querySelector("#sale-items-container");
      const rows = container.querySelectorAll(".sale-item-row");
      const items = [];

      rows.forEach((row) => {
        const select = row.querySelector(".sale-item-select");
        const qtyInput = row.querySelector(".sale-qty-input");
        const priceInput = row.querySelector(".sale-price-input");

        const itemId = select ? select.value : "";
        const quantity = parseInt(qtyInput ? qtyInput.value : 0, 10) || 0;
        const unitPrice = parseFloat(priceInput ? priceInput.value : 0) || 0;

        if (itemId && quantity > 0) {
          items.push({
            itemId: itemId,
            quantity: quantity,
            unitPrice: unitPrice,
            totalPrice: quantity * unitPrice,
          });
        }
      });

      const payload = {
        items: items,
        customerName: form.elements.customerName
          ? form.elements.customerName.value
          : "",
        customerPhone: form.elements.customerPhone
          ? form.elements.customerPhone.value
          : "",
        saleDate: form.elements.saleDate ? form.elements.saleDate.value : "",
        paymentMethod: form.elements.paymentMethod
          ? form.elements.paymentMethod.value
          : "Cash",
        status: form.elements.status ? form.elements.status.value : "Completed",
        notes: form.elements.notes ? form.elements.notes.value : "",
        createdBy: "System",
      };

      if (!validateSaleForm(payload)) {
        return;
      }

      showLoading(true);
      serverCall(
        saleId ? "updateSale" : "createSale",
        ...(saleId
          ? [saleId, payload, state.sessionToken]
          : [payload, state.sessionToken]),
      )
        .then((response) => {
          applySalesData(response.data);
          closeSaleModal();
          toast(saleId ? "Sale updated." : "Sale created.", "success");
        })
        .catch((error) => {
          setText(
            selectors.saleFormError,
            error.message || "Unable to save sale.",
          );
        })
        .finally(() => showLoading(false));
    }

    function validateSaleForm(payload) {
      let message = "";

      if (!payload.items || !payload.items.length) {
        message = "At least one item is required.";
      } else {
        for (let i = 0; i < payload.items.length; i++) {
          const item = payload.items[i];
          if (!item.itemId) {
            message = `Item #${i + 1}: Select an item.`;
            break;
          }
          if (item.quantity <= 0) {
            message = `Item #${i + 1}: Quantity must be greater than zero.`;
            break;
          }
          if (item.unitPrice < 0) {
            message = `Item #${i + 1}: Unit price cannot be negative.`;
            break;
          }
        }
      }

      if (!message && !payload.customerName.trim()) {
        message = "Customer name is required.";
      } else if (!message && !payload.saleDate) {
        message = "Sale date is required.";
      }

      setText(selectors.saleFormError, message);
      return !message;
    }

    function printInvoice(saleId) {
      if (!saleId) {
        toast("Save the sale first before printing.", "warning");
        return;
      }

      showLoading(true);
      serverCall("printSaleInvoice", saleId, state.sessionToken)
        .then((response) => {
          if (response && response.data && response.data.html) {
            const printWindow = window.open(
              "",
              "_blank",
              "width=800,height=600",
            );
            if (printWindow) {
              printWindow.document.write(response.data.html);
              printWindow.document.close();
              printWindow.focus();
              printWindow.print();
            } else {
              toast("Please allow pop-ups to print the invoice.", "error");
            }
          } else {
            toast("Unable to generate invoice.", "error");
          }
        })
        .catch((error) => {
          toast(error.message || "Unable to print invoice.", "error");
        })
        .finally(() => showLoading(false));
    }

    function closeSaleInvoiceModal() {
      const modal = document.querySelector("#sale-invoice-modal");
      if (modal) {
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
      }
    }

    function deleteSaleRecord(saleId) {
      confirm(
        "Delete this sale? This will restore the stock by the recorded quantity.",
      ).then((confirmed) => {
        if (!confirmed) {
          return;
        }

        showLoading(true);
        serverCall("deleteSale", saleId, state.sessionToken)
          .then((response) => {
            applySalesData(response.data);
            toast("Sale deleted.", "success");
          })
          .catch((error) => {
            toast(error.message || "Unable to delete sale.", "error");
          })

      });
