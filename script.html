    function bindReportsModule() {
      document.querySelectorAll(selectors.reportsSegments).forEach((button) => {
        button.addEventListener("click", () => {
          const reportType = button.dataset.reportType;
          if (!reportType) {
            return;
          }

          state.reports.page = 1;
          setActiveReportType(reportType);
          toggleReportsDateFilters(reportType);
          loadReports(reportType);
        });
      });

      document
        .querySelectorAll(selectors.reportsExportButtons)
        .forEach((button) => {
          button.addEventListener("click", () => {
            const format = button.dataset.reportExport;
            exportCurrentReport(format);
          });
        });

      const searchInput = document.querySelector(selectors.reportsSearch);
      searchInput.addEventListener(
        "input",
        debounce((event) => {
          state.reports.query = event.target.value.trim().toLowerCase();
          state.reports.page = 1;
          renderReports();
        }, 200),
      );

      document
        .querySelector(selectors.reportsDateFrom)
        .addEventListener("change", handleReportsDateChange);
      document
        .querySelector(selectors.reportsDateTo)
        .addEventListener("change", handleReportsDateChange);
      document
        .querySelector(selectors.reportsClearDates)
        .addEventListener("click", clearReportsDates);

      document
        .querySelector(selectors.reportsPrev)
        .addEventListener("click", () => {
          state.reports.page = Math.max(state.reports.page - 1, 1);
          renderReports();
        });

      document
        .querySelector(selectors.reportsNext)
        .addEventListener("click", () => {
          const totalPages = getReportsTotalPages();
          state.reports.page = Math.min(state.reports.page + 1, totalPages);
          renderReports();
        });
    }

    function handleReportsDateChange() {
      const reportType = state.reports.currentType || "sales";

      if (reportType !== "sales" && reportType !== "purchases") {
        return;
      }

      state.reports.dateFrom = document.querySelector(
        selectors.reportsDateFrom,
      ).value;
      state.reports.dateTo = document.querySelector(
        selectors.reportsDateTo,
      ).value;
      state.reports.page = 1;
      loadReports(reportType, { force: true });
    }

    function clearReportsDates() {
      state.reports.dateFrom = "";
      state.reports.dateTo = "";
      document.querySelector(selectors.reportsDateFrom).value = "";
      document.querySelector(selectors.reportsDateTo).value = "";
      state.reports.page = 1;
      loadReports(
        state.reports.currentType ||
          getDefaultReportTypeForRole(state.user && state.user.role),
        { force: true },
      );
    }

    function toggleReportsDateFilters(reportType) {
      const dateFilters = document.querySelector(selectors.reportsDateFilters);
      const supportsDates =
        reportType === "sales" || reportType === "purchases";
      dateFilters.hidden = !supportsDates;
    }

    function getReportFilters() {
      return {
        dateFrom: state.reports.dateFrom || "",
        dateTo: state.reports.dateTo || "",
      };
    }

    function setActiveReportType(reportType) {
      document.querySelectorAll(selectors.reportsSegments).forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.reportType === reportType,
        );
      });
    }

    function ensureReportsMeta() {
      if (state.reports.metaLoaded) {
        return Promise.resolve();
      }

      return serverCall("getReportsPageMeta", state.sessionToken)
        .then((response) => {
          const meta = response && response.data ? response.data : {};
          state.reports.metaLoaded = true;

          if (meta.defaultPageSize) {
            state.reports.pageSize = meta.defaultPageSize;
          }

          if (Array.isArray(meta.reportTypes) && meta.reportTypes.length) {
            document
              .querySelectorAll(selectors.reportsSegments)
              .forEach((button) => {
                button.hidden = !meta.reportTypes.includes(
                  button.dataset.reportType,
                );
              });
            if (!meta.reportTypes.includes(state.reports.currentType)) {
              state.reports.currentType = meta.reportTypes[0];
            }
          }
        })
        .catch(() => {
          state.reports.metaLoaded = true;
        });
    }

    function loadReports(reportType = state.reports.currentType, options = {}) {
      const requestedType =
        reportType ||
        getDefaultReportTypeForRole(state.user && state.user.role);
      const type = isReportTypeAllowedForRole(
        requestedType,
        state.user && state.user.role,
      )
        ? requestedType
        : getDefaultReportTypeForRole(state.user && state.user.role);
      const filters = getReportFilters();

      if (
        state.reports.loaded &&
        state.reports.currentType === type &&
        state.reports.dateFrom === filters.dateFrom &&
        state.reports.dateTo === filters.dateTo &&
        !options.force
      ) {
        renderReports();
        return;
      }

      showLoading(true);

      ensureReportsMeta()
        .then(() =>
          serverCall("getReportsData", type, filters, state.sessionToken),
        )
        .then((response) => {
          state.reports.loaded = true;
          state.reports.currentType = type;
          state.reports.data = response && response.data ? response.data : null;
          state.reports.page = 1;
          setActiveReportType(type);
          toggleReportsDateFilters(type);
          renderReports();
        })
        .catch((error) => {
          toast(error.message || "Unable to load reports.", "error");
        })
        .finally(() => showLoading(false));
    }

    function getFilteredReportRows() {
      const report = state.reports.data || {};
      const rows = report.rows || [];
      const query = state.reports.query;

      if (!query) {
        return rows;
      }

      return rows.filter((row) => row.join(" ").toLowerCase().includes(query));
    }

    function getReportsTotalPages(filteredRows = getFilteredReportRows()) {
      return Math.max(
        Math.ceil(filteredRows.length / state.reports.pageSize),
        1,
      );
    }

    function getReportsPaginationSummary(total, start, count) {
      if (!total) {
        return "Showing 0 records";
      }

      return `Showing ${start + 1}-${start + count} of ${total} records`;
    }

    function getReportRecordLabel(reportType) {
      if (reportType === "purchases") {
        return "purchase records";
      }

      if (reportType === "lowstock") {
        return "low stock items";
      }

      if (reportType === "sales") {
        return "sale records";
      }

      return "records";
    }

    function renderReports() {
      const report = state.reports.data || {};
      const reportType =
        report.reportType || state.reports.currentType || "sales";
      const title = report.title || "Sales Report";
      const summaryLabel = report.summaryLabel || "Summary";
      const summaryValue =
        report.summaryValueDisplay != null
          ? report.summaryValueDisplay
          : report.summaryValue != null
            ? report.summaryValue
            : "";
      const columns = report.columns || [];
      const filteredRows = getFilteredReportRows();
      const totalPages = getReportsTotalPages(filteredRows);

      state.reports.page = Math.min(
        Math.max(state.reports.page, 1),
        totalPages,
      );

      const start = (state.reports.page - 1) * state.reports.pageSize;
      const pageRows = filteredRows.slice(
        start,
        start + state.reports.pageSize,
      );

      const tableWrapper = document.querySelector(
        selectors.reportsTableWrapper,
      );
      const status = document.querySelector(selectors.reportsStatus);
      const thead = document.querySelector(selectors.reportsTableHead);
      const tbody = document.querySelector(selectors.reportsTableBody);
      const pagination = document.querySelector(selectors.reportsPagination);

      setText(selectors.reportsTitle, title);
      setText(
        selectors.reportsCount,
        `${filteredRows.length} ${getReportRecordLabel(reportType)}`,
      );
      setText(selectors.reportsSummary, `${summaryLabel}: ${summaryValue}`);

      if (!columns.length) {
        status.textContent = "No report columns configured.";
        tableWrapper.hidden = true;
        pagination.hidden = true;
        return;
      }

      status.textContent = filteredRows.length
        ? `${filteredRows.length} ${filteredRows.length === 1 ? "record" : "records"} matched your filters.`
        : "No report data found for the selected filters.";

      tableWrapper.hidden = false;
      thead.innerHTML = "";

      const headerRow = document.createElement("tr");
      columns.forEach((column) => {
        const th = document.createElement("th");
        th.textContent = column;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      tbody.innerHTML = "";

      if (!pageRows.length) {
        tbody.appendChild(
          createEmptyRow(columns.length, "No matching records found."),
        );
      } else {
        pageRows.forEach((row) => {
          const tr = document.createElement("tr");
          row.forEach((cell) => {
            appendCell(tr, cell == null ? "" : cell);
          });
          tbody.appendChild(tr);
        });
      }

      pagination.hidden = totalPages <= 1;
      pagination.style.display = totalPages > 1 ? "flex" : "none";
      setText(
        selectors.reportsPaginationSummary,
        getReportsPaginationSummary(
          filteredRows.length,
          start,
          pageRows.length,
        ),
      );
      document.querySelector(selectors.reportsPrev).disabled =
        state.reports.page <= 1;
      document.querySelector(selectors.reportsNext).disabled =
        state.reports.page >= totalPages;
    }

    function downloadExportFile(data) {
      if (!data) {
        return;
      }

      if (data.contentBase64) {
        const binary = atob(data.contentBase64);
        const bytes = new Uint8Array(binary.length);

        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }

        const blob = new Blob([bytes], {
          type: data.mimeType || "application/octet-stream",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = data.fileName || "report";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        return;
      }

      if (data.fileUrl) {
        window.open(data.fileUrl, "_blank", "noopener,noreferrer");
      }
    }

    function exportCurrentReport(format = "pdf") {
      const reportType = state.reports.currentType || "sales";
      const filters = getReportFilters();

      showLoading(true);
      serverCall(
        "exportReport",
        reportType,
        format,
        filters,
        state.sessionToken,
      )
        .then((response) => {
          const data = response && response.data ? response.data : {};
          downloadExportFile(data);
          toast(
            `${String(format || "pdf").toUpperCase()} export downloaded.`,
            "success",
          );
        })
        .catch((error) => {
          toast(error.message || "Unable to export report.", "error");
        })
        .finally(() => showLoading(false));
    }

    /* ================================================================
       INVENTORY MODULE
       ================================================================ */

    function bindInventoryModule() {
      const searchInput = document.querySelector("[data-inventory-search]");
      const filterSelect = document.querySelector("[data-inventory-filter]");
      const expiryDaysInput = document.querySelector(
        "[data-inventory-expiry-days]",
      );
      const prevBtn = document.querySelector("[data-inventory-prev]");
      const nextBtn = document.querySelector("[data-inventory-next]");

      if (searchInput) {
        searchInput.addEventListener(
          "input",
          debounce((event) => {
            state.inventory.query = event.target.value.trim().toLowerCase();
            state.inventory.page = 1;
            renderInventory();
          }, 200),
        );
      }

      if (filterSelect) {
        filterSelect.addEventListener("change", (event) => {
          state.inventory.filter = event.target.value;
          state.inventory.page = 1;
          renderInventory();
        });
      }

      if (expiryDaysInput) {
        expiryDaysInput.addEventListener(
          "input",
          debounce(() => {
            state.inventory.expiryWarningDays =
              parseInt(expiryDaysInput.value, 10) || 30;
            state.inventory.page = 1;
            renderInventory();
          }, 150),
        );
      }

      if (prevBtn) {
        prevBtn.addEventListener("click", () => {
          if (state.inventory.page > 1) {
            state.inventory.page--;
            renderInventory();
          }
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          state.inventory.page++;
          renderInventory();
        });
      }

      // Initial render after navigation
      if (!state.inventory.loaded) {
        loadInventory();
      }
    }

    function loadInventory(options = {}) {
      if (state.inventory.loaded && !options.force) {
        renderInventory();
        return;
      }

      showLoading(true);
      serverCall("getInventory", state.sessionToken)
        .then((response) => {
          applyInventoryData(response.data || {});
          toast("Inventory loaded.", "success");
        })
        .catch((error) => {
          toast(error.message || "Unable to load inventory.", "error");
        })
        .finally(() => showLoading(false));
    }

    function applyInventoryData(data) {
      state.inventory.summary = data.summary || [];
      state.inventory.batches = data.batches || [];
      state.inventory.expiryWarningDays =
        parseInt(data.expiryWarningDays, 10) || 30;
      state.inventory.loaded = true;
      state.inventory.batchCache = {};
      renderInventory();
    }

    function renderInventory() {
      renderInventorySummary();
    }

    function resetInventoryBatches_() {
      const tbody = document.querySelector("#inventory-batch-tbody");
      const countEl = document.querySelector("#inventory-batch-count");
      if (!tbody) return;
      tbody.innerHTML = "";
      tbody.appendChild(
        createEmptyRow(5, "Select a medicine to view batches."),
      );
      if (countEl) countEl.textContent = "—";
    }

    function renderInventorySummary() {
      const tbody = document.querySelector("#inventory-summary-tbody");
      const countEl = document.querySelector("#inventory-summary-count");
      const paginationEl = document.querySelector("#inventory-pagination");
      const summaryEl = document.querySelector("#inventory-pagination-summary");
      const prevBtn = document.querySelector("[data-inventory-prev]");
      const nextBtn = document.querySelector("[data-inventory-next]");

      if (!tbody) return;

      const query = (state.inventory.query || "").trim();
      const filter = state.inventory.filter || "all";

      const enriched = (state.inventory.summary || []).map((row) => {
        return Object.assign({}, row, {
          status:
            row.currentStock <= 0 || row.currentStock <= row.minimumStock
              ? "Low"
              : "OK",
        });
      });

      const filtered = enriched.filter((row) => {
        const t = `${row.itemId} ${row.name} ${row.category}`.toLowerCase();
        const matchesQuery = !query || t.includes(query);
        let matchesFilter = true;
        if (filter === "low") {
          matchesFilter = row.currentStock <= row.minimumStock;
        } else if (filter === "expired") {
          matchesFilter =
            typeof row.nearestExpiryDays === "number" &&
            row.nearestExpiryDays < 0;
        } else if (filter === "expiring") {
          matchesFilter =
            typeof row.nearestExpiryDays === "number" &&
            row.nearestExpiryDays >= 0 &&
            row.nearestExpiryDays <= state.inventory.expiryWarningDays;
        }
        return matchesQuery && matchesFilter;
      });

      const total = filtered.length;
      const pageSize = state.inventory.pageSize || 10;
      const totalPages = Math.max(Math.ceil(total / pageSize), 1);

      if (state.inventory.page > totalPages) state.inventory.page = totalPages;
      if (state.inventory.page < 1) state.inventory.page = 1;

      const startIndex = (state.inventory.page - 1) * pageSize;
      const pageItems = filtered.slice(startIndex, startIndex + pageSize);

      tbody.innerHTML = "";

      if (!pageItems.length) {
        tbody.appendChild(createEmptyRow(6, "No inventory summary found."));
      } else {
        pageItems.forEach((row) => {
          const isExpanded = state.inventory.expandedMedicineId === row.itemId;

          // Main medicine row
          const tr = document.createElement("tr");
          tr.dataset.medicineId = row.itemId;
          if (isExpanded) {
            tr.classList.add("inventory-row-expanded");
          }

          // Expand/collapse affordance
          const firstCell = document.createElement("td");
          firstCell.style.display = "flex";
          firstCell.style.alignItems = "center";
          firstCell.style.gap = "10px";

          const caret = document.createElement("span");
          caret.className = "inventory-caret";
          caret.textContent = isExpanded ? "▾" : "▸";

          const label = document.createElement("span");
          label.textContent = row.name || row.itemId;
          label.style.fontWeight = "600";

          firstCell.appendChild(caret);
          firstCell.appendChild(label);
          tr.appendChild(firstCell);

          appendCell(tr, row.category || "-", "");
          appendCell(
            tr,
            formatters.number.format(row.currentStock || 0),
            "numeric-cell",
          );
          appendCell(
            tr,
            formatters.number.format(row.minimumStock || 0),
            "numeric-cell",
          );
          appendCell(
            tr,
            row.nearestExpiryDate ? formatDate(row.nearestExpiryDate) : "-",
          );

          const badge = document.createElement("span");
          badge.className = "status-badge";
          const st = row.nearestExpiryStatus || "OK";
          if (st === "Expired") badge.classList.add("status-danger");
          else if (st === "Expiring") badge.classList.add("status-warning");
          else badge.classList.add("status-active");
          badge.textContent = st;

          const td = document.createElement("td");
          td.appendChild(badge);
          tr.appendChild(td);

          tr.addEventListener("click", () => {
            toggleInventoryMedicine_(row.itemId, row.name);
          });

          tbody.appendChild(tr);

          // If expanded, render a full-width detail row immediately below
          if (isExpanded) {
            const detailTr = document.createElement("tr");
            detailTr.className = "inventory-detail-row";
            const detailTd = document.createElement("td");
            detailTd.colSpan = 6;
            detailTd.style.padding = "0";

            const wrap = document.createElement("div");
            wrap.className = "inventory-detail-wrap";
            wrap.innerHTML = `
              <div class="inventory-detail-loading" style="padding: 16px; color: var(--muted)">Loading batches…</div>
              <div class="inventory-detail-table" style="display:none"></div>
            `;

            detailTd.appendChild(wrap);
            detailTr.appendChild(detailTd);
            tbody.appendChild(detailTr);

            // Kick off lazy load with client-side caching
            loadInventoryBatchesForMedicineIntoCell_(
              row.itemId,
              row.name,
              wrap,
            );
          }
        });
      }

      if (countEl) {
        countEl.textContent = `${total} item${total === 1 ? "" : "s"}`;
      }

      if (paginationEl) {
        if (total === 0) {
          paginationEl.style.display = "none";
        } else {
          paginationEl.style.display = "flex";
          if (summaryEl) {
            const count = pageItems.length;
            summaryEl.textContent = `Showing ${startIndex + 1}-${startIndex + count} of ${total} items`;
          }
          if (prevBtn) prevBtn.disabled = state.inventory.page <= 1;
          if (nextBtn) nextBtn.disabled = state.inventory.page >= totalPages;
        }
      }
    }

    async function toggleInventoryMedicine_(
      medicineId,
      medicineName,
      options = {},
    ) {
      const shouldSilent = options && options.silent;

      // Collapse if clicking same medicine.
      if (state.inventory.expandedMedicineId === medicineId) {
        state.inventory.expandedMedicineId = null;
        state.inventory.expandedMedicineName = null;
        if (!shouldSilent) renderInventory();
        return;
      }

      // Expand new medicine (only one at a time)
      state.inventory.expandedMedicineId = medicineId;
      state.inventory.expandedMedicineName = medicineName;

      if (!shouldSilent) renderInventory();
    }

    function renderInventoryBatchesIntoCell_(batches, wrapEl) {
      if (!wrapEl) return;

      const loadingEl = wrapEl.querySelector(".inventory-detail-loading");
      const tableHost = wrapEl.querySelector(".inventory-detail-table");
      if (!tableHost) return;

      if (loadingEl) loadingEl.style.display = "none";
      tableHost.style.display = "block";
      tableHost.innerHTML = "";

      if (!batches || !batches.length) {
        tableHost.innerHTML = `
          <div style="padding: 16px; color: var(--muted)">No batch details recorded for this medicine.</div>
        `;
        return;
      }

      const rowsHtml = batches
        .map((b) => {
          const exp = b.expiryDate ? formatDate(b.expiryDate) : "-";
          const rem = formatters.number.format(b.remainingQuantity || 0);
          const cost = formatters.currency.format(b.costPrice || 0);
          const sell = formatters.currency.format(b.sellingPrice || 0);
          return `
            <tr>
              <td><strong style="color: var(--primary, #2563eb);">${b.batchNumber || "-"}</strong></td>
              <td class="numeric-cell">${rem}</td>
              <td>${exp}</td>
              <td class="numeric-cell">${cost}</td>
              <td class="numeric-cell">${sell}</td>
            </tr>
          `;
        })
        .join("");

      tableHost.innerHTML = `
        <div style="padding: 14px 16px 16px">
          <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
            <thead>
              <tr style="border-bottom: 1px solid var(--border, #e2e8f0); color: var(--muted, #64748b);">
                <th style="text-align: left; padding: 6px 8px;">Batch Number</th>
                <th class="numeric-cell" style="padding: 6px 8px;">Remaining Qty</th>
                <th style="text-align: left; padding: 6px 8px;">Expiry Date</th>
                <th class="numeric-cell" style="padding: 6px 8px;">Cost Price</th>
                <th class="numeric-cell" style="padding: 6px 8px;">Selling Price</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      `;
    }

    async function loadInventoryBatchesForMedicineIntoCell_(
      medicineId,
      medicineName,
      wrapEl,
    ) {
      if (!wrapEl) return;

      // Check client-side batch cache first for instantaneous expand!
      if (!state.inventory.batchCache) {
        state.inventory.batchCache = {};
      }

      if (state.inventory.batchCache[medicineId]) {
        renderInventoryBatchesIntoCell_(
          state.inventory.batchCache[medicineId],
          wrapEl,
        );
        return;
      }

      serverCall("getMedicineBatches", medicineId, state.sessionToken)
        .then((response) => {
          const batches =
            response && response.data && response.data.batches
              ? response.data.batches
              : [];
          state.inventory.batchCache[medicineId] = batches;
          renderInventoryBatchesIntoCell_(batches, wrapEl);
        })
        .catch(() => {
          state.inventory.batchCache[medicineId] = [];
          renderInventoryBatchesIntoCell_([], wrapEl);
        });
    }

    function destroyTomSelectIfExists_(el) {
      if (!el) return;
      if (el.tomselect) {
        try {
          el.tomselect.destroy();
        } catch (e) {}
        el.tomselect = null;
      }
    }

    function initPurchaseItemTomSelect_() {
      const itemSelect = document.querySelector(selectors.purchaseItemInput);
      if (!itemSelect) return;

      // If TomSelect already exists on this element, skip re-initialization
      if (itemSelect.tomselect) {
        return;
      }

      // If TomSelect library is not loaded, fall back to native select
      if (typeof TomSelect === "undefined") {
        console.warn(
          "TomSelect library is not loaded. Searchable dropdown will not work for purchases.",
        );
        return;
      }

      // Collect current options from the select element
      const options = [];
      for (let i = 0; i < itemSelect.options.length; i++) {
        const opt = itemSelect.options[i];
        if (opt.value) {
          options.push({
            value: opt.value,
            text: opt.textContent,
          });
        }
      }

      // Store the currently selected value before TomSelect replaces the DOM
      const currentValue = itemSelect.value;

      // Create TomSelect instance with search capability
      const ts = new TomSelect(itemSelect, {
        options: options,
        create: false,
        maxItems: 1,
        placeholder: "Search for an item...",
        sortField: {
          field: "text",
          direction: "asc",
        },
        searchField: ["text"],
        render: {
          option: function (data, escape) {
            return (
              '<div class="ts-option-purchase">' + escape(data.text) + "</div>"
            );
          },
          item: function (data, escape) {
            return (
              '<div class="ts-item-purchase">' + escape(data.text) + "</div>"
            );
          },
        },
      });

      // Restore the selected value
      if (currentValue) {
        ts.setValue(currentValue, true);
      }

      // Store reference on the element for cleanup
      itemSelect.tomselect = ts;
    }

    function bindSettingsModule() {
      document
        .querySelector(selectors.settingsSaveBtn)
        .addEventListener("click", handleSettingsSave);

      document
        .querySelector(selectors.settingsResetBtn)
        .addEventListener("click", handleSettingsReset);

      // Live logo preview
      document
        .querySelector(selectors.settingsLogoUrl)
        .addEventListener("input", updateLogoPreview);

      // Live tax preview
      document
        .querySelector(selectors.settingsCurrencySymbol)
        .addEventListener("input", updateTaxPreview);
      document
        .querySelector(selectors.settingsTaxLabel)
        .addEventListener("input", updateTaxPreview);
      document
        .querySelector(selectors.settingsTaxRate)
        .addEventListener("input", updateTaxPreview);
    }

    function loadSettings(options = {}) {
      if (state.settings.loaded && !options.force) {
        return;
      }

      showLoading(true);
      serverCall("getSettings", state.sessionToken)
        .then((response) => {
          applySettingsData(response.data || {});
        })
        .catch((error) => {
          toast(error.message || "Unable to load settings.", "error");
        })
        .finally(() => showLoading(false));
    }

    function applySettingsData(data) {
      state.settings.data = data || {};
      state.settings.loaded = true;

      const d = state.settings.data;

      setInputValue(selectors.settingsCompanyName, d.companyName);
      setInputValue(selectors.settingsCompanyEmail, d.companyEmail);
      setInputValue(selectors.settingsCompanyPhone, d.companyPhone);
      setInputValue(selectors.settingsCompanyAddress, d.companyAddress);
      setInputValue(selectors.settingsLogoUrl, d.logoUrl);
      setInputValue(selectors.settingsInvoicePrefix, d.invoicePrefix);
      setInputValue(selectors.settingsInvoiceNextNo, d.invoiceNextNo);
      setSelectValue(selectors.settingsCurrency, d.currency);
      setInputValue(selectors.settingsCurrencySymbol, d.currencySymbol);
      setInputValue(selectors.settingsTaxLabel, d.taxLabel);
      setInputValue(selectors.settingsTaxRate, d.taxRate);
      setSelectValue(selectors.settingsTimezone, d.timezone);
      setSelectValue(selectors.settingsDateFormat, d.dateFormat);
      setSelectValue(selectors.settingsLanguage, d.language);

      // Checkboxes
      const lowStock = document.querySelector(selectors.settingsLowStockAlert);
      if (lowStock) {
        lowStock.checked =
          d.lowStockAlert === "true" || d.lowStockAlert === true;
      }
      const dark = document.querySelector(selectors.settingsDarkMode);
      if (dark) {
        dark.checked = d.darkMode === "true" || d.darkMode === true;
        document.body.classList.toggle("dark-mode", dark.checked);
      }

      updateLogoPreview();
      updateTaxPreview();
    }

    function collectSettingsPayload() {
      const lowStock = document.querySelector(selectors.settingsLowStockAlert);
      const dark = document.querySelector(selectors.settingsDarkMode);

      return {
        companyName: getInputValue(selectors.settingsCompanyName),
        companyEmail: getInputValue(selectors.settingsCompanyEmail),
        companyPhone: getInputValue(selectors.settingsCompanyPhone),
        companyAddress: getInputValue(selectors.settingsCompanyAddress),
        logoUrl: getInputValue(selectors.settingsLogoUrl),
        invoicePrefix: getInputValue(selectors.settingsInvoicePrefix),
        invoiceNextNo: getInputValue(selectors.settingsInvoiceNextNo),
        currency: getSelectValue(selectors.settingsCurrency),
        currencySymbol: getInputValue(selectors.settingsCurrencySymbol),
        taxLabel: getInputValue(selectors.settingsTaxLabel),
        taxRate: getInputValue(selectors.settingsTaxRate),
        timezone: getSelectValue(selectors.settingsTimezone),
        dateFormat: getSelectValue(selectors.settingsDateFormat),
        language: getSelectValue(selectors.settingsLanguage),
        lowStockAlert: lowStock ? String(lowStock.checked) : "true",
        darkMode: dark ? String(dark.checked) : "false",
      };
    }

    function validateSettingsPayload(payload) {
      const errEl = document.querySelector(selectors.settingsFormError);
      errEl.textContent = "";

      if (!payload.companyName || payload.companyName.length < 2) {
        errEl.textContent = "Company name must be at least 2 characters.";
        return false;
      }
      if (!payload.invoicePrefix || payload.invoicePrefix.length < 1) {
        errEl.textContent = "Invoice prefix is required.";
        return false;
      }
      if (!payload.currency) {
        errEl.textContent = "Currency is required.";
        return false;
      }
      if (!payload.currencySymbol) {
        errEl.textContent = "Currency symbol is required.";
        return false;
      }
      const tax = parseFloat(payload.taxRate);
      if (isNaN(tax) || tax < 0 || tax > 100) {
        errEl.textContent = "Tax rate must be between 0 and 100.";
        return false;
      }
      return true;
    }

    function handleSettingsSave() {
      const payload = collectSettingsPayload();
      if (!validateSettingsPayload(payload)) {
        return;
      }

      showLoading(true);
      serverCall("saveSettings", payload, state.sessionToken)
        .then((response) => {
          applySettingsData(response.data || {});
          toast("Settings saved successfully.", "success");
        })
        .catch((error) => {
          toast(error.message || "Unable to save settings.", "error");
        })
        .finally(() => showLoading(false));
    }

    function handleSettingsReset() {
      confirm(
        "Reset all settings to default values? This cannot be undone.",
      ).then((ok) => {
        if (!ok) {
          return;
        }

        showLoading(true);
        serverCall("resetSettings", state.sessionToken)
          .then((response) => {
            applySettingsData(response.data || {});
            toast("Settings reset to defaults.", "success");
          })
          .catch((error) => {
            toast(error.message || "Unable to reset settings.", "error");
          })
          .finally(() => showLoading(false));
      });
    }

    function updateLogoPreview() {
      const url = getInputValue(selectors.settingsLogoUrl).trim();
      const wrap = document.querySelector(selectors.settingsLogoPreviewWrap);
      const img = document.querySelector(selectors.settingsLogoPreview);
      if (!wrap || !img) {
        return;
      }
      if (url) {
        img.src = url;
        wrap.hidden = false;
      } else {
        img.src = "";
        wrap.hidden = true;
      }
    }

    function updateTaxPreview() {
      const symbol =
        getInputValue(selectors.settingsCurrencySymbol) || "\u20A8";
      const taxLabel = getInputValue(selectors.settingsTaxLabel) || "GST";
      const taxRate = parseFloat(getInputValue(selectors.settingsTaxRate)) || 0;
      const basePrice = 1000;
      const taxAmount = (basePrice * taxRate) / 100;
      const total = basePrice + taxAmount;

      const fmt = (n) =>
        symbol +
        " " +
        n.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });

      setText(selectors.settingsPreviewPrice, fmt(basePrice));
      setText(selectors.settingsPreviewTaxLabel, `${taxLabel} (${taxRate}%)`);
      setText(selectors.settingsPreviewTaxAmount, fmt(taxAmount));
      setText(selectors.settingsPreviewTotal, fmt(total));
    }

    /* ---------- Input/Select helpers ---------- */
    function setInputValue(selector, value) {
      const el = document.querySelector(selector);
      if (el) {
        el.value = value != null ? value : "";
      }
    }

    function getInputValue(selector) {
      const el = document.querySelector(selector);
      return el ? el.value.trim() : "";
    }

    function setSelectValue(selector, value) {
      const el = document.querySelector(selector);
      if (!el || !value) {
        return;
      }
      for (let i = 0; i < el.options.length; i++) {
        if (el.options[i].value === value) {
          el.selectedIndex = i;
          return;
        }
      }
    }

    function getSelectValue(selector) {
      const el = document.querySelector(selector);
      return el ? el.value : "";
    }

    return {
      init,
      navigate,
      serverCall,
      showLoading,
      toast,
      confirm,
    };
  })();

  document.addEventListener("DOMContentLoaded", App.init);
</script>
